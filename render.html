<!doctype html>
<!-- Só para scripts/render-stills.mjs (servido pelo Vite em dev; não entra no build). -->
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>render</title>
  <style>html, body { margin: 0; background: transparent; } #c { position: fixed; inset: 0; }</style>
</head>
<body>
  <div id="c"></div>
  <script type="module">
    import { criarCasa } from '/src/cena/casa.js';
    import { criarExplodida } from '/src/cena/explodida.js';
    const p = new URLSearchParams(location.search);
    const el = document.getElementById('c');
    const fundo = p.get('fundo');
    let cena;
    if (p.get('cena') === 'explodida') {
      cena = await criarExplodida(el, { still: true, fundo });
      cena.definir(Number(p.get('separacao') ?? 0));
      window.__rotulos = () => cena.rotulos();
    } else {
      cena = await criarCasa(el, { still: true, fundo, tiro: p.get('tiro') ?? 'hero' });
      cena.definirEstado(p.get('estado') ?? 'vazio', true);
    }
    await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
    cena.renderizar();
    window.__imagem = (tipo, q) => cena.renderer.domElement.toDataURL(tipo, q);
    window.__pronto = true;
  </script>
</body>
</html>
